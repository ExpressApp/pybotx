workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

stages:
  - check
  - package

variables:
  PYTHON_VERSION: "3.13"

default:
  image: "python:${PYTHON_VERSION}-bookworm"
  tags:
    - docker
  before_script:
    - python -m pip install uv
    - uv sync --locked --dev

test:
  stage: check
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - >-
      uv run --no-sync ./scripts/test -n 4 --cov-report=xml
      --junitxml=junit.xml --junit-prefix="py${PYTHON_VERSION}"
  coverage: '/^TOTAL\s+.*\s+([0-9]+(?:\.[0-9]+)?%)\s*$/'
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint:
  stage: check
  script:
    - uv run --no-sync ./scripts/lint

docs-lint:
  stage: check
  script:
    - uv run --no-sync bash ./scripts/docs-lint

package:
  stage: package
  script:
    - uv build
  artifacts:
    paths:
      - dist/
